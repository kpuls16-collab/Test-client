name: Build Halcyon

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build all modules
        run: gradle build --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp $(ls stub/build/libs/*.jar | grep -v -e '-dev' -e '-sources' | head -n1) dist/halcyon-stub.jar
          cp payload/build/libs/halcyon-payload.jar dist/
          cp agent/build/libs/halcyon-agent.jar dist/
          cp injector/build/libs/halcyon-injector.jar dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Halcyon
          path: dist/*.jar
