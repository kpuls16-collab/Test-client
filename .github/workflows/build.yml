      - name: Build all modules
        working-directory: Halcyon
        run: gradle build --stacktrace

      - name: Collect artifacts
        working-directory: Halcyon
        run: |
          mkdir -p dist
          cp $(ls stub/build/libs/*.jar | grep -v -e '-dev' -e '-sources' | head -n1) dist/halcyon-stub.jar
          cp payload/build/libs/halcyon-payload.jar dist/
          cp agent/build/libs/halcyon-agent.jar dist/
          cp injector/build/libs/halcyon-injector.jar dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Halcyon
          path: Halcyon/dist/*.jar
